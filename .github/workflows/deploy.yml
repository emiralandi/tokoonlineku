name: Deploy tokoonlineku

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 300s
          script: |
            set -e
            CONTAINER_ID=$(docker ps -q --filter "label=com.docker.compose.project=tokoonlineku")
            test -n "$CONTAINER_ID"
            docker restart "$CONTAINER_ID"
            for i in {1..30}; do
              if curl -fsS https://tokoonlineku.indonesiadigital.id >/dev/null; then exit 0; fi
              sleep 10
            done
            docker logs --tail 100 "$CONTAINER_ID"
            exit 1